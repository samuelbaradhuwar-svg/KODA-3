<!doctype html>
<html lang="en-ZA">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="robots" content="noindex, nofollow, noarchive" />
    <meta name="referrer" content="no-referrer" />
    <title>Email authenticator</title>
    <link rel="icon" type="image/webp" href="/favicon.webp" />
    <link rel="manifest" href="/command-app.webmanifest" />
    <link rel="apple-touch-icon" href="/command-apple-touch-icon.png" />
    <meta name="theme-color" content="#F6F6F4" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#101010" media="(prefers-color-scheme: dark)" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Authenticator" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <script>
      (function () {
        try {
          var s = localStorage.getItem("koda-theme");
          var dark = s ? s === "dark" : window.matchMedia("(prefers-color-scheme: dark)").matches;
          if (dark && location.pathname.indexOf("/report/") !== 0) document.documentElement.classList.add("dark");
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-paper text-ink">
    <div id="root"></div>
    <script type="module" src="/src/command-main.jsx"></script>
  </body>
</html>
